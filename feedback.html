main{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:12px}header img{width:48px;height:48px;border-radius:12px}header h1{font-size:24px;margin:0;flex:1}
.lang{display:flex;gap:6px}.lang button{font:inherit;font-size:14px;font-weight:800;border:2px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:5px 10px;cursor:pointer}.lang button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.intro{color:var(--mut);margin:12px 0 18px}
fieldset{border:0;margin:0 0 20px;padding:0}
legend{font-weight:800;font-size:18px;padding:0;margin-bottom:8px}legend small{font-weight:600;color:var(--mut);font-size:14px}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:52px}
.opt input{width:24px;height:24px;margin:0;accent-color:var(--acc);flex:none}
.opt:has(input:checked){border-color:var(--acc)}
.rate{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.rate .opt{justify-content:center;padding:12px 0;margin:0;font-weight:800;font-size:20px}.rate .opt input{position:absolute;opacity:0;pointer-events:none}.rate .opt:has(input:checked){background:var(--acc);color:var(--accfg)}
.rate .opt:has(input:focus-visible){outline:3px solid var(--fg);outline-offset:2px}
input[type=text],textarea{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg)}textarea{min-height:110px;resize:vertical}
.go{font:inherit;font-weight:800;font-size:18px;width:100%;border:0;border-radius:16px;padding:16px;background:var(--acc);color:var(--accfg);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.go:disabled{opacity:.6}.msg{color:#ff7a90;font-weight:700;min-height:24px;margin:6px 0}
.done{text-align:center;padding:40px 0}.done .big{font-size:64px}
.note{color:var(--mut);font-size:13px;margin-top:18px}
.hp{position:absolute;left:-9999px;opacity:0}[hidden]{display:none!important}
</style></head><body><main>
