name: Android-app bouwen

# Handmatig starten: GitHub > Actions > "Android-app bouwen" > Run workflow
# Zonder geheimen: bouwt een debug-APK om op je eigen telefoon te testen.
# Met de vier ANDROID_*-geheimen: bouwt ook een ondertekende AAB voor Google Play.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Debug-APK bouwen
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yippo-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Ondertekende AAB bouwen (alleen met geheimen)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_KEY == 'true' }}
        with:
          name: yippo-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
