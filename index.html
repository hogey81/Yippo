<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5a189a">
<meta name="description" content="Yippo: Wissel, plof en brul! Maak wilde combo's, bouw een leeuw en versla je vrienden in de dagelijkse puzzel. 🦁">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yippo">
<meta property="og:title" content="Yippo">
<meta property="og:description" content="Wissel, plof en brul! Maak wilde combo's, bouw een leeuw en versla je vrienden in de dagelijkse puzzel. 🦁">
<meta property="og:type" content="website">
<meta property="og:image" content="https://yippo-game.vercel.app/icons/share.png">
<meta name="twitter:card" content="summary_large_image">
<title>Yippo</title>
<style>
:root{--cell:44px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#fff;
  background:linear-gradient(#7b2cbf,#5a189a 55%,#240046);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom))}
.screen.on{display:flex}
.pill{background:#0000004d;border-radius:18px;padding:7px 13px;font-weight:800;font-size:15px;white-space:nowrap}
.btn{background:#ffd23f;color:#5b3a00;font-weight:800;border-radius:16px;padding:13px 20px;font-size:17px;box-shadow:0 4px 0 #b88a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a00}
.btn.alt{background:#c77dff;color:#2b0057;box-shadow:0 4px 0 #7b2cbf}
.btn.dim{background:#ffffff33;color:#fff;box-shadow:0 4px 0 #0004}
.btn:disabled{opacity:.4;pointer-events:none}

/* menu */
#menu{justify-content:center;gap:14px;text-align:center}
#menu h1{font-size:44px;margin:0;text-shadow:0 5px 0 #0004;line-height:1.05}
#menu .sub{opacity:.85;margin:0 0 10px}
#menu .btn{width:min(320px,86vw)}
#zoo{font-size:34px;letter-spacing:6px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.streak{font-size:13px;opacity:.9}

/* levels */
#levels{gap:10px}
#levels h2{margin:6px 0}
#lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(430px,100%);overflow:auto;padding:4px;flex:1;align-content:start}
.lv{aspect-ratio:1;border-radius:16px;background:#ffffff26;font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 #0004}
.lv small{font-size:11px;letter-spacing:1px;height:13px}
.lv.next{background:#ffd23f;color:#5b3a00;animation:pulse 1.2s infinite}
.lv.locked{opacity:.35;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.08)}}

/* game */
#game{gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;width:calc(var(--cell)*7);gap:6px}
.goals{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:34px}
.goal{background:#0000004d;border-radius:14px;padding:5px 11px;font-weight:800;font-size:15px}
.goal.done{background:#2d9b4acc}
.bar{width:calc(var(--cell)*7);height:14px;border-radius:9px;background:#0005;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:9px;transition:width .35s}
#boardwrap{position:relative}
#board{position:relative;width:calc(var(--cell)*7);height:calc(var(--cell)*8);background:#0000004d;border-radius:18px;overflow:hidden;touch-action:none}
#board.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.cellbg{position:absolute;width:var(--cell);height:var(--cell);padding:2px}
.cellbg::before{content:"";display:block;width:100%;height:100%;border-radius:12px;background:#ffffff0f}
.iceov{position:absolute;width:var(--cell);height:var(--cell);padding:1px;z-index:5;pointer-events:none}
.iceov::before{content:"";display:block;width:100%;height:100%;border-radius:13px;background:rgba(170,225,255,.5);border:2px solid #ffffffaa;box-shadow:inset 0 0 10px #fff9}
.tile{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);padding:3px;transition:transform .22s ease-in;will-change:transform;z-index:2}
.tile .t{width:100%;height:100%;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.6);
  box-shadow:inset 0 -4px 0 #0003,0 2px 3px #0003;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;position:relative}
.tile.sel .t{transform:scale(1.14);outline:3px solid #fff;filter:brightness(1.2)}
.tile.hint .t{animation:wig .6s ease-in-out infinite}
@keyframes wig{25%{transform:scale(1.12) rotate(-6deg)}75%{transform:scale(1.12) rotate(6deg)}}
.tile.pop .t{animation:pop .26s ease-out forwards}
@keyframes pop{30%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
.tile.born .t{animation:born .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes born{from{transform:scale(0)}}
.t.sp{background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc300 55%,#e07a00)!important;box-shadow:0 0 14px 3px #ffe066,inset 0 -4px 0 #0003;animation:glow 1s ease-in-out infinite alternate}
.t.sp.unicorn{background:conic-gradient(#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c77dff,#ff6b6b)!important}
@keyframes glow{to{box-shadow:0 0 22px 7px #fff3a0,inset 0 -4px 0 #0003}}
.t.sp.lion::after{position:absolute;right:1px;bottom:-1px;font-size:calc(var(--cell)*.3);font-weight:900;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.t.sp.lion[data-dir=h]::after{content:"↔"}
.t.sp.lion[data-dir=v]::after{content:"↕"}
.fx{position:absolute;pointer-events:none;z-index:9;font-weight:900;text-shadow:0 2px 0 #0007}
#combo{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:40px;font-weight:900;color:#ffe066;
  text-shadow:0 4px 0 #b8000a,0 0 20px #ff0;pointer-events:none;opacity:0;z-index:10;transform:rotate(-6deg)}
#combo.go{animation:combo .9s ease-out}
@keyframes combo{0%{opacity:0;transform:rotate(-6deg) scale(.3)}25%{opacity:1;transform:rotate(-6deg) scale(1.2)}70%{opacity:1}100%{opacity:0;transform:rotate(-6deg) translateY(-30px) scale(1)}}
.tools{display:flex;gap:10px;margin-top:2px}
.tools .btn{padding:10px 16px;font-size:16px}
.tools .on{background:#ff6b6b;color:#fff;box-shadow:0 4px 0 #b02a2a}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#000b;padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;text-align:center}
#toast.on{opacity:1}

/* scoreboard */
#lb{gap:8px}
#lb h2{margin:6px 0 0}
.tabs{display:flex;gap:8px}
.tab{background:#ffffff26;border-radius:14px;padding:9px 14px;font-weight:800;font-size:15px}
.tab.on{background:#ffd23f;color:#5b3a00}
.lbBody{width:min(430px,100%);flex:1;overflow:auto;padding:4px 2px}
.lbBtns{display:flex;gap:10px}
.lbBtns .btn{padding:10px 16px;font-size:16px}
.muted{opacity:.8;text-align:center;margin:14px 0}
.lbhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 2px 10px;font-weight:800}
.lbhead small{font-weight:600;opacity:.85}
.lbrow{display:flex;align-items:center;gap:10px;background:#ffffff1f;border-radius:14px;padding:10px 12px;margin-bottom:6px;font-weight:700}
.lbrow.me{background:#ffd23f;color:#3d2800}
.lbrow .rk{width:34px;text-align:center;font-size:18px}
.lbrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .sc{min-width:64px;text-align:right}
.lbrow .sc2{min-width:70px;text-align:right;opacity:.75;font-size:13px}
.lbrow.click{cursor:pointer}
.chip{background:#0000004d;border-radius:10px;padding:2px 8px;font-size:13px;letter-spacing:1px}
.lbact{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.lbact .btn{padding:9px 14px;font-size:15px}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:0;font-size:18px;font-weight:700;text-align:center;margin-top:8px;color:#2b0057;-webkit-user-select:text;user-select:text}
/* wereldkaart, dierentuin, nieuw beginscherm (testmodus ?beta=1) */
#map{padding:0}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#mapSvg{display:block;width:100%;height:auto}
.mapTop{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.mapTop .pill{background:#000a}
.mapBottom{position:absolute;left:0;right:0;bottom:0;padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;align-items:center;background:linear-gradient(transparent,#0006)}
.mapBottom .btn{padding:12px 16px;font-size:17px}
#mapSvg g[data-l]{cursor:pointer}
@keyframes pulseR{50%{transform:scale(1.1)}}
.cur{transform-box:fill-box;transform-origin:center;animation:pulseR 1.1s ease-in-out infinite}
#menu2{justify-content:flex-start;overflow-y:auto;gap:12px;text-align:center}
.m2head{margin-top:6px;display:flex;flex-direction:column;align-items:center}
.m2head img{width:78px;height:78px;border-radius:20px;border:3px solid #fff;box-shadow:0 8px 20px #0006}
.m2head h1{font-size:38px;margin:2px 0 0;text-shadow:0 5px 0 #0004;line-height:1.1}
.m2btn{width:min(380px,100%);border-radius:20px;text-align:left;padding:14px 18px;display:block;position:relative}
.m2play{background:#ffd23f;color:#5b3a00;box-shadow:0 5px 0 #b88a00}
.m2daily{background:#c77dff;color:#2b0057;box-shadow:0 5px 0 #7b2cbf}
.m2btn .t{display:block;font-weight:900;font-size:21px}
.m2btn .s{display:block;font-weight:700;font-size:13px;margin-top:2px}
.m2btn .side{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:32px}
.m2zoo{width:min(380px,100%);border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 0 #3d7a1e;background:linear-gradient(#a8d86b,#6fb23e);color:#fff;position:relative;padding:0;text-align:left}
.m2zoo .scene{height:108px;position:relative;white-space:nowrap;padding:34px 8px 0;font-size:42px}
.m2zoo .scene span{margin-right:4px;filter:drop-shadow(0 4px 2px #0003)}
.m2zoo .foot{background:#0000005a;padding:8px 14px 10px}
.m2zoo .foot b{font-size:19px;display:block}
.bar2{display:flex;align-items:center;gap:8px;margin-top:4px;font-weight:800;font-size:13px}
.bar2 i{display:block;height:100%;background:#ffd23f}
.bar2 div{flex:1;height:10px;border-radius:6px;background:#0005;overflow:hidden}
.m2row{display:flex;gap:10px;width:min(380px,100%)}
.m2row .m2btn{flex:1;width:auto;background:#ffffff26;color:#fff;padding:10px 14px}
.m2row .m2btn .t{font-size:16px}
.m2links{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.nb{position:absolute;background:#ff6b6b;color:#fff;font-weight:900;font-size:11px;border-radius:9px;padding:2px 8px;box-shadow:0 2px 0 #0004}
.sil{filter:grayscale(1) brightness(0) opacity(.3)}
#zooScreen{justify-content:flex-start;gap:8px;overflow-y:auto}
.zhead{display:flex;gap:8px;align-items:center;justify-content:center}
.zchips{display:flex;gap:6px;justify-content:center}
.zchip{background:#ffffff33;border-radius:14px;padding:6px 12px;font-size:20px}
.zchip.on{background:#ffd23f}.zchip.lock{opacity:.4}
.pen{width:min(400px,100%);border-radius:22px;padding:34px 10px 10px;position:relative;border:5px dashed #7a5230}
.pen h3{position:absolute;left:10px;top:6px;margin:0;font-size:14px;background:#ffffffd0;color:#2b0057;border-radius:10px;padding:2px 9px}
.pen .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.an{background:none;text-align:center;padding:4px 0;position:relative}
.an .e{font-size:42px;line-height:1.15;filter:drop-shadow(0 4px 2px #0003)}
.an .l{display:block;font-size:11px;font-weight:800;color:#2b0057}
.an.locked .e{filter:grayscale(1) brightness(0) opacity(.3)}
.rew{background:#ffffff1f;border-radius:16px;padding:10px;margin:10px 0}
.rew .big{font-size:64px;line-height:1.1}
/* e-mail dialog */
.msg{min-height:20px;margin:8px 0 0;font-weight:700;color:#ffe066}
.code{font-size:30px!important;letter-spacing:10px;font-variant-numeric:tabular-nums}
.linkbtn{background:none;color:#ffffffcc;text-decoration:underline;font-size:15px;padding:6px}
/* modal */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.card{background:linear-gradient(#7b2cbf,#3c096c);border:3px solid #ffffff55;border-radius:24px;padding:22px;width:min(380px,100%);text-align:center;box-shadow:0 12px 40px #0008;max-height:92vh;overflow:auto;animation:born .35s}
.card h2{margin:0 0 6px;font-size:28px}
.card p{margin:6px 0;opacity:.92}
.card .row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.stars{font-size:44px;letter-spacing:4px;margin:4px 0}
table.help{width:100%;border-collapse:collapse;text-align:left;font-size:14px;margin-top:8px}
table.help td{padding:5px 4px;border-bottom:1px solid #ffffff22;vertical-align:top}
table.help td:first-child{white-space:nowrap}
</style>
</head>
<body>

<div id="menu" class="screen on">
  <div id="zoo">🐶🐱🐸🐼</div>
  <h1 id="gameName">Yippo</h1>
  <p class="sub">Wissel dieren, maak setjes, bouw een dierentuin vol combo's!</p>
  <button class="btn" id="mPlay">▶ Spelen</button>
  <button class="btn alt" id="mDaily">📅 Dagelijkse puzzel</button>
  <div class="streak" id="streakTxt"></div>
  <button class="btn dim" id="mBoard" style="display:none">🏅 Scorebord &amp; leagues</button>
  <button class="btn dim" id="mAccount" style="display:none">👤 Account</button>
  <button class="btn dim" id="mLevels">🗺 Levels</button>
  <button class="btn dim" id="mHelp">❓ Hoe werkt het?</button>
  <button class="linkbtn" id="mLogin" style="display:none">🔑 Heb je al een account? Inloggen</button>
  <button class="btn dim" id="mSound">🔊 Geluid aan</button>
</div>

<div id="menu2" class="screen">
  <div class="m2head"><img src="icons/icon-192.png" alt=""><h1 id="m2Title">Yippo</h1></div>
  <button class="m2btn m2play" id="m2Play"><span class="t">▶ Spelen</span><span class="s" id="m2PlaySub"></span><span class="side" id="m2Map">🗺</span></button>
  <button class="m2btn m2daily" id="m2Daily"><span class="t">📅 Dagelijkse puzzel</span><span class="s" id="m2DailySub"></span></button>
  <button class="m2zoo" id="m2Zoo"><div class="scene" id="m2Scene"></div><div class="foot"><b>🏡 Bekijk je dierentuin</b><div class="bar2"><div><i id="m2ZooBar"></i></div><span id="m2ZooTxt"></span></div></div></button>
  <div class="m2row"><button class="m2btn" id="m2Board"><span class="t">🏅 Scorebord</span><span class="s" id="m2BoardSub">Wereldwijd</span></button><button class="m2btn" id="m2League"><span class="t">👨‍👩‍👧 Leagues</span><span class="s" id="m2LeagueSub">Met vrienden</span></button></div>
  <div class="m2links"><button class="linkbtn" id="m2Account">👤 Account</button><button class="linkbtn" id="m2Help">❓ Hoe werkt het?</button><button class="linkbtn" id="m2Sound">🔊 Geluid</button></div>
  <button class="linkbtn" id="m2Login" style="display:none">🔑 Heb je al een account? Inloggen</button>
</div>

<div id="map" class="screen">
  <div id="mapScroll"><svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="mapTop"><span class="pill" id="mapPill"></span><span class="pill" id="mapHint" style="font-size:12px"></span></div>
  <div class="mapBottom"><button class="btn dim" id="mapBack">← Menu</button><button class="btn" id="mapPlay">▶ Speel level 1</button><button class="btn dim" id="mapZoo">🏡</button></div>
</div>

<div id="zooScreen" class="screen">
  <div class="zhead"><button class="pill" id="zooBack">←</button><span class="pill" style="font-size:17px" id="zooTitle">🏡 Mijn dierentuin</span></div>
  <div class="zchips"><span class="zchip on">🦓</span><span class="zchip lock">🦙</span><span class="zchip lock">🐧</span><span class="zchip lock">🐼</span><span class="zchip lock">🦩</span></div>
  <div id="zooPens" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px"></div>
  <div class="mapBottom" style="position:static;background:none"><button class="btn" id="zooMap">🗺 Naar de kaart</button></div>
</div>

<div id="levels" class="screen">
  <h2>Kies een level</h2>
  <div id="lvgrid"></div>
  <button class="btn dim" id="lvBack">← Terug</button>
</div>

<div id="lb" class="screen">
  <h2>🏅 Scorebord</h2>
  <div class="tabs"><button class="tab on" id="tabWorld">🌍 Wereld</button><button class="tab" id="tabLeagues">👨‍👩‍👧 Mijn leagues</button></div>
  <div class="lbBody" id="lbBody"></div>
  <div class="lbBtns"><button class="btn dim" id="lbName">✏️ Naam</button><button class="btn dim" id="lbBack">← Menu</button></div>
</div>

<div id="game" class="screen">
  <div class="top">
    <button class="pill" id="gMenu">☰</button>
    <span class="pill" id="gLevel"></span>
    <span class="pill" id="gMoves"></span>
    <span class="pill" id="gScore"></span>
  </div>
  <div class="goals" id="goals"></div>
  <div class="bar"><i id="barfill"></i></div>
  <div id="boardwrap"><div id="board"></div><div id="combo"></div></div>
  <div class="tools">
    <button class="btn" id="tHammer">🔨 <span>2</span></button>
    <button class="btn" id="tShuffle">🔀 <span>1</span></button>
    <button class="btn dim" id="tHelp">❓</button>
  </div>
</div>

<div id="modal"><div class="card" id="card"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ============ constants ============ */
const GAME_NAME='Yippo'; // één plek om de naam te wijzigen (ook in <title> en <h1 id="gameName">)
const COLS=7, ROWS=8, MAX_LEVEL=40;
const ANIMALS=[
  {e:'🐶',c:'#e9c46a'},{e:'🐱',c:'#e76f51'},{e:'🐸',c:'#52b788'},
  {e:'🐼',c:'#aab4c8'},{e:'🦊',c:'#ff9f1c'},{e:'🐰',c:'#f7a8c4'},{e:'🐵',c:'#a47551'}
];
const SPECIAL={lion:'🦁',elephant:'🐘',dragon:'🐉',unicorn:'🦄'};

/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,window.__fast?0:ms));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const today=()=>dateStr(new Date());
const yesterday=()=>dateStr(new Date(Date.now()-864e5));
const fmt=n=>n.toLocaleString('nl-NL');

/* ============ save ============ */
let S={unlocked:1,stars:{},best:{},daily:{},streak:{count:0,last:''},sound:true,seenHelp:false,player:null,leagues:[],pending:null,auth:null,zoo:[],zooSeen:[],beta:false};
try{Object.assign(S,JSON.parse(localStorage.getItem('dm_save')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('dm_save',JSON.stringify(S))}catch(e){}if(window.scheduleSync)scheduleSync()}
// Testmodus voor nieuwe functies: open de site met ?beta=1 (aan) of ?beta=0 (uit)
const BETA=(()=>{try{const q=new URLSearchParams(location.search).get('beta');if(q==='1'){S.beta=true;save()}else if(q==='0'){S.beta=false;save()}}catch(e){}return !!S.beta})();

/* ============ audio ============ */
let ac=null;
function audio(){
  if(!S.sound)return null;
  try{ if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended')ac.resume(); return ac }catch(e){return null}
}
function tone(f,d=.12,type='sine',vol=.16,delay=0,slide=0){
  const a=audio();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);
}
function noise(d=.35,vol=.25,freq=900){
  const a=audio();if(!a)return;
  const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=b;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;
  s.connect(f).connect(g).connect(a.destination);s.start();
}
const PENT=[0,2,4,7,9];
const note=i=>261.63*Math.pow(2,(PENT[i%5]+12*Math.floor(i/5))/12);
const sfx={
  swap:()=>tone(330,.08,'triangle',.1),
  bad:()=>{tone(180,.14,'square',.08);tone(140,.18,'square',.08,.08)},
  match:c=>{const i=Math.min(c*2,14);tone(note(i),.16,'triangle',.18);tone(note(i+2),.2,'sine',.1,.05)},
  special:()=>{noise(.5,.35,500);tone(110,.45,'sawtooth',.15,0,-60)},
  born:()=>{tone(660,.1,'square',.08);tone(990,.18,'triangle',.12,.08)},
  win:()=>[0,2,4,7,9,12].forEach((n,i)=>tone(261.63*Math.pow(2,n/12),.3,'triangle',.18,i*.1)),
  lose:()=>[0,-2,-5,-9].forEach((n,i)=>tone(300*Math.pow(2,n/12),.3,'sawtooth',.1,i*.16)),
  ui:()=>tone(520,.07,'triangle',.1)
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ============ level definitions ============ */
function levelDef(L){
  const r=mulberry32(L*7919+13);
  const hard=Math.max(0,L-2);                 // level 1-2 zijn de uitleg-levels, daarna wordt het steeds pittiger
  const types=L<=2?5:6;
  let moves=L<=2?28-L:Math.max(20,22-Math.floor(hard/4));
  const goals=[];let ice=0;
  const pickT=(ex=[])=>{let t;do{t=Math.floor(r()*types)}while(ex.includes(t));return t};
  const base=L===1?10:L===2?8:12+Math.min(7,Math.floor(hard*.4)),k=L%5;
  if(L<=2){
    if(L===1)goals.push({kind:'collect',type:pickT(),n:base});
    else{const a=pickT(),b=pickT([a]);goals.push({kind:'collect',type:a,n:base-2},{kind:'collect',type:b,n:base-2})}
  }else if(k===1){goals.push({kind:'collect',type:pickT(),n:base+4})}
  else if(k===2){
    const a=pickT(),b=pickT([a]);
    goals.push({kind:'collect',type:a,n:base},{kind:'collect',type:b,n:base});
    if(L>=12){const c=pickT([a,b]);goals.push({kind:'collect',type:c,n:base-2})}
  }
  else if(k===3){ice=Math.min(13,5+Math.floor(hard*.45));goals.push({kind:'ice',n:ice},{kind:'collect',type:pickT(),n:base-2});moves+=2}
  else if(k===4){goals.push({kind:'special',n:3+Math.floor(hard/6)},{kind:'collect',type:pickT(),n:base-2})}
  else{ice=Math.min(12,4+Math.floor(hard*.4));goals.push({kind:'score',n:Math.min(3200,1500+L*50)},{kind:'ice',n:ice});moves+=3}
  return {L,types,moves,goals,ice,seed:L*104729+1};
}
function dailyDef(){
  const d=today(),h=hashStr(d);
  return {daily:true,date:d,types:6,moves:25,ice:8,seed:h,goals:[]};
}

/* ============ matching ============ */
function findGroups(swapCells=[]){
  const pats=[];
  for(let r=0;r<ROWS;r++){let c=0;while(c<COLS){const t=T(r,c);if(t<0){c++;continue}let e=c;while(e+1<COLS&&T(r,e+1)===t)e++;
    if(e-c+1>=3){const cells=[];for(let x=c;x<=e;x++)cells.push([r,x]);pats.push({kind:'h',t,cells})}c=e+1}}
  for(let c=0;c<COLS;c++){let r=0;while(r<ROWS){const t=T(r,c);if(t<0){r++;continue}let e=r;while(e+1<ROWS&&T(e+1,c)===t)e++;
    if(e-r+1>=3){const cells=[];for(let x=r;x<=e;x++)cells.push([x,c]);pats.push({kind:'v',t,cells})}r=e+1}}
  for(let r=0;r<ROWS-1;r++)for(let c=0;c<COLS-1;c++){const t=T(r,c);
    if(t>=0&&T(r,c+1)===t&&T(r+1,c)===t&&T(r+1,c+1)===t)pats.push({kind:'sq',t,cells:[[r,c],[r,c+1],[r+1,c],[r+1,c+1]]})}
  if(!pats.length)return [];
  const parent=pats.map((_,i)=>i),find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));
  const owner=new Map();
  pats.forEach((p,i)=>p.cells.forEach(([r,c])=>{const k=r*COLS+c;if(owner.has(k))parent[find(i)]=find(owner.get(k));else owner.set(k,i)}));
  const comps=new Map();
  pats.forEach((p,i)=>{const R=find(i);if(!comps.has(R))comps.set(R,{pats:[],cells:new Set()});const o=comps.get(R);o.pats.push(p);p.cells.forEach(([r,c])=>o.cells.add(r*COLS+c))});
  const out=[];
  comps.forEach(o=>{
    let maxRun=0,longest=null,hasH=false,hasV=false,hasSq=false;
    o.pats.forEach(p=>{if(p.kind==='sq')hasSq=true;else{if(p.kind==='h')hasH=true;else hasV=true;if(p.cells.length>maxRun){maxRun=p.cells.length;longest=p}}});
    let s=null,dir=null;
    if(maxRun>=5)s='unicorn';
    else if(hasH&&hasV)s='dragon';
    else if(maxRun===4){s='lion';dir=longest.kind==='h'?'v':'h'}
    else if(hasSq)s='elephant';
    const cells=[...o.cells].map(k=>[Math.floor(k/COLS),k%COLS]);
    let spawn=null;
    if(s){
      let pos=null;
      for(const sc of swapCells)if(o.cells.has(sc.r*COLS+sc.c)){pos=[sc.r,sc.c];break}
      if(!pos&&s==='dragon'){
        const hs=new Set();o.pats.forEach(p=>{if(p.kind==='h')p.cells.forEach(([r,c])=>hs.add(r*COLS+c))});
        for(const p of o.pats)if(p.kind==='v')for(const [r,c] of p.cells)if(hs.has(r*COLS+c)){pos=[r,c];break}
      }
      if(!pos&&longest)pos=longest.cells[Math.floor(longest.cells.length/2)];
      if(!pos)pos=cells[0];
      spawn={r:pos[0],c:pos[1],s,dir};
    }
    out.push({cells,spawn});
  });
  return out;
}

function swapG(a,b){const t=grid[a.r][a.c];grid[a.r][a.c]=grid[b.r][b.c];grid[b.r][b.c]=t}
function findMoves(){
  const normal=[],special=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(r2>=ROWS||c2>=COLS)continue;
    const a=grid[r][c],b=grid[r2][c2];if(!a||!b)continue;
    const pa={r,c},pb={r:r2,c:c2};
    if(a.s||b.s){special.push({a:pa,b:pb});continue}
    swapG(pa,pb);const ok=findGroups().length>0;swapG(pa,pb);
    if(ok)normal.push({a:pa,b:pb});
  }
  return {normal,special};
}
const hasMove=()=>{const m=findMoves();return m.normal.length+m.special.length>0};

/* ============ special effects ============ */
function commonType(){
  const cnt={};for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=T(r,c);if(t>=0)cnt[t]=(cnt[t]||0)+1}
  let best=-1,n=0;for(const k in cnt)if(cnt[k]>n){n=cnt[k];best=+k}return best;
}
function blastOf(tile,add){
  const {r,c}=tile;
  const row=x=>{for(let i=0;i<COLS;i++)add(x,i)},col=x=>{for(let i=0;i<ROWS;i++)add(i,x)};
  if(tile.s==='lion'){tile.dir==='h'?row(r):col(c)}
  else if(tile.s==='elephant'){for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)add(r+i,c+j)}
  else if(tile.s==='dragon'){row(r);col(c)}
  else if(tile.s==='unicorn'){const t=commonType();for(let i=0;i<ROWS;i++)for(let j=0;j<COLS;j++)if(T(i,j)===t)add(i,j);add(r,c)}
}
const inb=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
function expand(set){
  let n=0;const queue=[...set];
  const add=(r,c)=>{if(inb(r,c)&&grid[r][c]){const k=r*COLS+c;if(!set.has(k)){set.add(k);queue.push(k)}}};
  while(queue.length){
    const k=queue.pop(),t=grid[Math.floor(k/COLS)][k%COLS];
    if(!t||!t.s||t.used)continue;
    t.used=true;n++;blastOf(t,add);
  }
  return n;
}
function swapEffect(ta,tb){
  const set=new Set(),add=(r,c)=>{if(inb(r,c)&&grid[r][c])set.add(r*COLS+c)};
  const sa=ta.s,sb=tb.s;
  if(sa==='unicorn'||sb==='unicorn'){
    const u=sa==='unicorn'?ta:tb,o=u===ta?tb:ta;
    add(u.r,u.c);u.used=true;
    if(o.s==='unicorn'){o.used=true;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)add(r,c)}
    else if(o.s){
      const t=commonType();o.used=true;add(o.r,o.c);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(T(r,c)===t){const x=grid[r][c];x.s=o.s;x.t=-1;x.dir=Math.random()<.5?'h':'v';look(x);add(r,c)}
    }else{for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(T(r,c)===o.t)add(r,c);add(o.r,o.c)}
  }else if(sa&&sb){
    ta.used=tb.used=true;add(ta.r,ta.c);add(tb.r,tb.c);
    const {r,c}=tb;
    if(sa===sb&&sa==='lion'){for(let i=0;i<COLS;i++)add(r,i);for(let i=0;i<ROWS;i++)add(i,c)}
    else if(sa===sb){for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)add(r+i,c+j)}
    else{for(let d=-1;d<=1;d++){for(let i=0;i<COLS;i++)add(r+d,i);for(let i=0;i<ROWS;i++)add(i,c+d)}}
  }else{
    const sp=sa?ta:tb;add(sp.r,sp.c); // the special itself; expand() fires its blast
  }
  return set;
}

}

    p.style.cssText=`left:${c*cell+cell/2}px;top:${r*cell+cell/2}px;width:${s}px;height:${s}px;border-radius:50%;background:${color}`;

  }
}
function comboText(t){const e=$('#combo');e.textContent=t;e.classList.remove('go');void e.offsetWidth;e.classList.add('go')}

/* ============ clearing / gravity ============ */
async function clearSet(set,combo,spawns,nAct){
  let pts=0;
  set.forEach(k=>{
    const r=Math.floor(k/COLS),c=k%COLS,tile=grid[r][c];if(!tile)return;
    pts+=tile.s?30*combo:10*combo;
    if(!tile.s)G.collected[tile.t]=(G.collected[tile.t]||0)+1;
    if(ice[r][c]){ice[r][c]=0;G.iceNow--;const el=$('#ice'+r+'_'+c);if(el)el.remove();pts+=20}
    tile.el.classList.add('pop');burst(r,c,tile.s?'#ffe066':ANIMALS[tile.t].c);
    grid[r][c]=null;const el=tile.el;setTimeout(()=>el.remove(),260);
  });
  G.score+=pts;
  const f=[...set][0];fxAt(Math.floor(f/COLS),f%COLS,'+'+pts,'#ffe066');
  sfx.match(combo);buzz(12);
  if(nAct){sfx.special();board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');buzz(60)}
  if(combo>=2)comboText(GAME_NAME.toUpperCase()+' x'+combo+'!');
  await sleep(230);
  spawns.forEach(s=>{
    const t=mkTile(-1,s.s,s.dir);grid[s.r][s.c]=t;attach(t,s.r,s.c,true);
    G.specialsMade++;G.made[s.s]++;G.score+=50;sfx.born();
  });
  hud();
}
function gravity(){
  const late=[];
  for(let c=0;c<COLS;c++){
    let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){const t=grid[r][c];if(t){if(r!==w){grid[w][c]=t;grid[r][c]=null;place(t,w,c)}w--}}
    const n=w+1;
    for(let r=w;r>=0;r--){const t=mkTile(Math.floor(G.rnd()*G.types));grid[r][c]=t;attach(t,r-n,c);late.push([t,r,c])}
  }
  void board.offsetHeight;
  late.forEach(([t,r,c])=>place(t,r,c));
}

async function resolve(initial,swapCells){
  let combo=0;
  while(true){
    const groups=findGroups(swapCells);
    const set=new Set(initial||[]);initial=null;
    groups.forEach(g=>g.cells.forEach(([r,c])=>set.add(r*COLS+c)));
    if(!set.size)break;
    combo++;
    const nAct=expand(set);
    await clearSet(set,combo,groups.filter(g=>g.spawn).map(g=>g.spawn),nAct);
    swapCells=[];
    gravity();
    await sleep(300);
  }
}

/* ============ board setup ============ */
function genBoard(gr){
  for(let attempt=0;attempt<300;attempt++){
    grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const ok=[];
      for(let t=0;t<G.types;t++){
        if(c>=2&&T(r,c-1)===t&&T(r,c-2)===t)continue;
        if(r>=2&&T(r-1,c)===t&&T(r-2,c)===t)continue;
        if(r>=1&&c>=1&&T(r-1,c)===t&&T(r,c-1)===t&&T(r-1,c-1)===t)continue;
        ok.push(t);
      }
      grid[r][c]=mkTile(ok[Math.floor(gr()*ok.length)]);
    }
    if(hasMove())return;
  }
}
function startGame(def,mode){
  closeModal();
  G={mode,def,types:def.types,moves:def.moves,score:0,collected:{},specialsMade:0,made:{lion:0,elephant:0,dragon:0,unicorn:0},
     iceNow:0,iceStart:0,busy:true,over:false,sel:null,hammerOn:false,hammers:2,shuffles:1,
     rnd:mode==='daily'?mulberry32(def.seed^0x9e3779b9):Math.random};
  show('game');
  board.innerHTML='';
  const gr=mulberry32(def.seed);
  genBoard(gr);
  ice=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  let n=def.ice;
  while(n>0){const r=Math.floor(gr()*ROWS),c=Math.floor(gr()*COLS);if(!ice[r][c]){ice[r][c]=1;n--}}
  G.iceNow=G.iceStart=def.ice;
  sizeBoard();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)attach(grid[r][c],r,c,true);
  drawBgs();
  hud();G.busy=false;scheduleHint();
  if(!S.seenHelp&&mode==='level'&&def.L===1){S.seenHelp=true;save();showHelp()}
}
const startLevel=L=>startGame(levelDef(L),'level');

/* ============ HUD ============ */
function goalHave(g){
  switch(g.kind){case'collect':return G.collected[g.type]||0;case'ice':return G.iceStart-G.iceNow;case'special':return G.specialsMade;case'score':return G.score}
}
const goalsMet=()=>G.def.goals.every(g=>goalHave(g)>=g.n);
function hud(){
  $('#gLevel').textContent=G.mode==='daily'?'📅 Dagelijks':'Level '+G.def.L;
  $('#gMoves').textContent='Zetten '+G.moves;
  $('#gScore').textContent='⭐ '+fmt(G.score);
  if(G.mode==='daily'){
    const best=S.daily[G.def.date]||0;
    $('#goals').innerHTML=`<span class="goal">🏆 Beste vandaag: ${fmt(Math.max(best,G.score))}</span>`;
    $('#barfill').style.width=Math.round((G.def.moves-G.moves)/G.def.moves*100)+'%';
    $('#tHammer span').textContent=G.hammers;$('#tShuffle span').textContent=G.shuffles;
    $('#tHammer').classList.toggle('on',G.hammerOn);
    return;
  }
  $('#goals').innerHTML=G.def.goals.map(g=>{
    const h=Math.min(goalHave(g),g.n),done=h>=g.n;
    const ic=g.kind==='collect'?ANIMALS[g.type].e:g.kind==='ice'?'🧊':g.kind==='special'?'🦁':'🎯';
    return `<span class="goal${done?' done':''}">${done?'✅':ic} ${fmt(h)}/${fmt(g.n)}</span>`;
  }).join('');
  const p=G.def.goals.reduce((a,g)=>a+Math.min(1,goalHave(g)/g.n),0)/G.def.goals.length;
  $('#barfill').style.width=Math.round(p*100)+'%';
  $('#tHammer span').textContent=G.hammers;$('#tShuffle span').textContent=G.shuffles;
  $('#tHammer').classList.toggle('on',G.hammerOn);
}

/* ============ input ============ */
function cellAt(e){
  const rc=board.getBoundingClientRect(),c=Math.floor((e.clientX-rc.left)/cell),r=Math.floor((e.clientY-rc.top)/cell);
  return inb(r,c)?{r,c}:null;
}
const adj=(a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
function setSel(p){
  if(G.sel){const t=grid[G.sel.r][G.sel.c];t&&t.el.classList.remove('sel')}
  G.sel=p;
  if(p){const t=grid[p.r][p.c];t&&t.el.classList.add('sel')}
}
board.addEventListener('pointerdown',e=>{
  if(!G||G.busy||G.over)return;
  const p=cellAt(e);if(!p)return;
  audio();clearHint();
  if(G.hammerOn){useHammer(p);return}
  if(G.sel&&adj(G.sel,p)){const s=G.sel;setSel(null);doSwap(s,p);return}
  if(G.sel&&G.sel.r===p.r&&G.sel.c===p.c){
    const was=grid[p.r][p.c];setSel(null);
    if(was&&was.s)activateAlone(p);
    return;
  }
  setSel(p);drag={p,x:e.clientX,y:e.clientY};
});
board.addEventListener('pointermove',e=>{
  if(!drag||!G||G.busy||G.over)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)<cell*.4)return;
  const from=drag.p,q={r:from.r,c:from.c};
  if(Math.abs(dx)>Math.abs(dy))q.c+=dx>0?1:-1;else q.r+=dy>0?1:-1;
  drag=null;if(!inb(q.r,q.c))return;
  setSel(null);doSwap(from,q);
});
addEventListener('pointerup',()=>{drag=null});

/* ============ turns ============ */
async function afterMove(initial,swapCells){
  await resolve(initial,swapCells);
  await endCheck();
  if(!G.over){G.busy=false;scheduleHint()}
}
async function doSwap(a,b){
  if(G.busy||G.over)return;
  G.busy=true;clearHint();
  const ta=grid[a.r][a.c],tb=grid[b.r][b.c];
  swapG(a,b);place(ta,b.r,b.c);place(tb,a.r,a.c);sfx.swap();
  await sleep(220);
  const special=ta.s||tb.s;
  if(!special&&!findGroups().length){
    swapG(a,b);place(ta,a.r,a.c);place(tb,b.r,b.c);sfx.bad();buzz(30);
    await sleep(220);G.busy=false;scheduleHint();return;
  }
  G.moves--;hud();
  const initial=special?swapEffect(ta,tb):null;
  await afterMove(initial,[b,a]);
}
async function activateAlone(p){
  if(G.busy||G.over)return;
  G.busy=true;G.moves--;hud();
  await afterMove(new Set([p.r*COLS+p.c]),[]);
}
async function useHammer(p){
  if(G.hammers<=0||!grid[p.r][p.c])return;
  G.hammers--;G.hammerOn=false;G.busy=true;hud();
  await afterMove(new Set([p.r*COLS+p.c]),[]);
}
async function doShuffle(auto){
  const tiles=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)tiles.push(grid[r][c]);
  const gr=Math.random;
  for(let attempt=0;attempt<500;attempt++){
    const arr=tiles.slice();
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(gr()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}
    arr.forEach((t,i)=>{grid[Math.floor(i/COLS)][i%COLS]=t});
    if(!findGroups().length&&hasMove()){
      arr.forEach((t,i)=>place(t,Math.floor(i/COLS),i%COLS));
      sfx.swap();await sleep(350);return;
    }
  }
  // fallback: re-roll all plain animals
  for(let attempt=0;attempt<500;attempt++){
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=grid[r][c];if(!t.s){t.t=Math.floor(gr()*G.types);look(t)}}
    if(!findGroups().length&&hasMove())break;
  }
  await sleep(300);
}

/* ============ end of turn ============ */
async function endCheck(){
  if(G.mode==='level'&&goalsMet()){return win()}
  if(G.moves<=0){return G.mode==='daily'?finishDaily():lose()}
  if(!hasMove()){toast('Geen zetten meer, schudden!');await sleep(700);await doShuffle(true)}
}
function stars(){const f=G.moves/G.def.moves;return f>=.3?3:f>=.12?2:1}

function storeSession(d){
  S.auth={access:d.access_token,refresh:d.refresh_token,exp:d.expires_at?d.expires_at*1000:Date.now()+(d.expires_in||3600)*1000,uid:d.user&&d.user.id||(S.auth&&S.auth.uid)||'',email:(d.user&&d.user.email)||''};
  ensurePlayer();S.player.id=S.auth.uid;save();
}
async function authReq(method,path,body,token){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);
  try{
    const res=await fetch(SB_URL+path,{method,signal:ctl.signal,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body||{})});
    const d=await res.json().catch(()=>null);
    if(!res.ok)throw new Error(String((d&&(d.error_code||d.msg||d.message))||'auth_failed'));
    return d;
  }catch(e){
    if(e.name==='AbortError'||e instanceof TypeError)throw new Error('offline');
    throw e;
  }finally{clearTimeout(t)}
}
const authCall=(path,body)=>authReq('POST',path,body);
let authP=null;
async function refreshOrSignup(){
  if(S.auth&&S.auth.refresh){
    try{storeSession(await authCall('/auth/v1/token?grant_type=refresh_token',{refresh_token:S.auth.refresh}));return S.auth.access}
    catch(e){if(e.message==='offline')throw e}   // ongeldige sessie: hieronder een nieuw gastaccount
  }
  storeSession(await authCall('/auth/v1/signup',{}));
  return S.auth.access;
}
function getToken(){
  if(S.auth&&S.auth.access&&S.auth.exp-Date.now()>60000)return Promise.resolve(S.auth.access);
  if(!authP)authP=refreshOrSignup().finally(()=>{authP=null});
  return authP;
}
async function rpc(fn,args,tokenOverride){
  const token=tokenOverride||await getToken();
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
  try{
    const res=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',signal:ctl.signal,
      headers:{apikey:SB_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
    const data=await res.json().catch(()=>null);
    if(!res.ok)throw new Error((data&&data.message)||'http_'+res.status);
    return data;
  }catch(e){
    if(e.name==='AbortError'||e instanceof TypeError)throw new Error('offline');
    throw e;
  }finally{clearTimeout(t)}
}

function mergeProgress(c){
  if(!c||typeof c!=='object')return;
  const num=v=>typeof v==='number'&&isFinite(v)&&v>=0;
  if(num(c.unlocked)&&c.unlocked>S.unlocked)S.unlocked=Math.min(MAX_LEVEL,Math.floor(c.unlocked));
  for(const k in (c.stars||{})){const v=c.stars[k];if(/^\d{1,2}$/.test(k)&&num(v)&&v<=3&&v>(S.stars[k]||0))S.stars[k]=v}
  for(const k in (c.best||{})){const v=c.best[k];if(/^\d{1,2}$/.test(k)&&num(v)&&v>(S.best[k]||0))S.best[k]=v}
  for(const k in (c.daily||{})){const v=c.daily[k];if(/^\d{4}-\d\d-\d\d$/.test(k)&&num(v)&&v>(S.daily[k]||0))S.daily[k]=v}
  const cs=c.streak;
  if(cs&&typeof cs.last==='string'&&num(cs.count)&&(cs.last>S.streak.last||(cs.last===S.streak.last&&cs.count>S.streak.count)))S.streak={count:cs.count,last:cs.last};
  (Array.isArray(c.leagues)?c.leagues:[]).forEach(l=>{
    if(l&&/^[A-Z0-9]{5}$/.test(l.code)&&typeof l.name==='string'&&!S.leagues.some(x=>x.code===l.code)&&S.leagues.length<10)S.leagues.push({code:l.code,name:l.name.slice(0,24)});
  });
  (Array.isArray(c.zoo)?c.zoo:[]).forEach(id=>{if(typeof id==='string'&&/^[a-z0-9-]{2,20}$/.test(id)&&ALL_ANIMALS.some(a=>a.id===id)&&!S.zoo.includes(id))S.zoo.push(id)});
  ensurePlayer();
  if(!S.player.name&&typeof c.name==='string')S.player.name=c.name.slice(0,20);
}
let syncT=null,syncing=false,booted=false;
window.scheduleSync=function(){
  if(!online()||!booted)return;
  clearTimeout(syncT);syncT=setTimeout(syncUp,2000);
};
async function syncUp(){
  if(!online()||!booted||syncing)return;
  syncing=true;
  try{await rpc('yippo_save_progress',{p_data:progressData()})}catch(e){}
  syncing=false;
}
async function bootOnline(){
  if(!online())return;
  try{
    const cloud=await rpc('yippo_load_progress');
    mergeProgress(cloud);
    booted=true;save();syncUp();
    if($('#menu').classList.contains('on'))toMenu();
  }catch(e){/* offline of gastaccounts staan uit: het spel werkt gewoon lokaal door */}
}

function modalRaw(html){$('#card').innerHTML=html;$('#modal').classList.add('on')}
const validEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
let codeTimer=null;
const OTP_LEN=6;   // moet gelijk zijn aan 'Email OTP Length' in Supabase (Authentication, Sign In / Providers, Email)

function emailDialog(login){

  modalRaw(`<h2>${login?'🔑 Inloggen':'💾 Bewaar je voortgang'}</h2>
    <p>${login?'Vul het e-mailadres van je account in. Je krijgt een code van 6 cijfers.':'Vul je e-mailadres in en je levels, scores en leagues blijven bewaard, ook op een nieuwe telefoon. Geen wachtwoord nodig!'}</p>

  const go=async()=>{

  };

// Geeft 'link' (gastaccount wordt aan e-mail gekoppeld) of 'login' (er bestaat al een account met dit adres).
async function sendCode(email,login){
  if(!login){
    const tok=await getToken();
    try{await authReq('PUT','/auth/v1/user',{email},tok);return 'link'}
    catch(e){if(e.message!=='email_exists'&&e.message!=='email_conflict_identity_not_deletable')throw e}
  }
  await authReq('POST','/auth/v1/otp',{email,create_user:false});
  return 'login';
}
function codeDialog(email,kind){
  clearInterval(codeTimer);
  modalRaw(`<h2>📬 Check je mail</h2>
    <p>We hebben een code van 6 cijfers gestuurd naar<br><b>${esc(email)}</b></p>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="cdIn" class="inp code" style="margin-top:0" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="10" placeholder="······"><button class="btn alt" id="cdPaste" style="padding:12px 14px;font-size:15px;white-space:nowrap">📋 Plak</button></div>
    <p class="msg" id="cdMsg"></p>
    <div class="row" style="margin-top:6px"><button class="btn" id="cdGo">Controleer code</button></div>
    <p><small>Niets ontvangen? Kijk ook in je spam.${kind==='login'?' Staat dit adres niet bij een account, dan komt er geen mail.':''}</small></p>
    <div class="row"><button class="btn dim" id="cdResend" disabled>Opnieuw sturen (30)</button><button class="btn dim" id="cdBack">Ander e-mailadres</button></div>`);
  let busy=false,left=30;
  const verify=async()=>{
    const code=($('#cdIn').value||'').replace(/\D/g,'');
    if(code.length<6||busy)return;
    busy=true;const msg=$('#cdMsg');msg.textContent='Controleren…';
    try{await verifyCode(email,code,kind)}
    catch(e){busy=false;msg.textContent=errText(e);const i=$('#cdIn');if(i){i.value='';i.focus()}}
  };
  $('#cdIn').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,10);if(e.target.value.length===OTP_LEN)verify()});
  $('#cdGo').onclick=verify;
  $('#cdPaste').onclick=async()=>{
    try{
      const t=await navigator.clipboard.readText(),m=String(t||'').match(/\d(?:[\s-]?\d){5,9}/),digits=(m?m[0]:'').replace(/\D/g,'');
      if(digits.length>=6){$('#cdIn').value=digits.slice(0,10);verify()}
      else toast('Kopieer eerst de code uit je mail 📋');
    }catch(e){toast('Houd het vakje ingedrukt en kies Plakken');const i=$('#cdIn');i&&i.focus()}
  };
  $('#cdBack').onclick=()=>emailDialog(kind==='login');
  const rs=$('#cdResend');
  codeTimer=setInterval(()=>{
    const b=$('#cdResend');if(!b){clearInterval(codeTimer);return}
    left--;if(left>0){b.textContent=`Opnieuw sturen (${left})`}else{b.textContent='Opnieuw sturen';b.disabled=false;clearInterval(codeTimer)}
  },1000);
  rs.onclick=async()=>{
    rs.disabled=true;rs.textContent='Versturen…';
    try{await sendCode(email,kind==='login');codeDialog(email,kind);toast('Nieuwe code onderweg 📬')}
    catch(e){$('#cdMsg').textContent=errText(e);rs.disabled=false;rs.textContent='Opnieuw sturen'}
  };
  setTimeout(()=>{const i=$('#cdIn');i&&i.focus()},80);
}
async function verifyCode(email,code,kind){
  const guestTok=kind==='login'?await getToken().catch(()=>null):null;
  const d=await authReq('POST','/auth/v1/verify',{type:kind==='link'?'email_change':'email',email,token:code});
  const oldUid=myId();
  if(d&&d.access_token)storeSession(d);
  else if(kind==='link'&&S.auth&&S.auth.refresh){S.auth.exp=0;await getToken()}   // sessie opnieuw ophalen met het bevestigde e-mailadres
  else throw new Error('otp_expired');
  if(kind==='login'&&oldUid&&oldUid!==S.auth.uid)await switchAccount(guestTok);
  else {booted=true;syncUp()}
  clearInterval(codeTimer);
  modal(`<h2>✅ Gelukt!</h2><p>Je voortgang is nu veilig bewaard${kind==='login'?' en teruggehaald':''}.</p><p><small>Op een nieuwe telefoon log je in met ${esc(email)}.</small></p>`,[['Verder spelen','',()=>toMenu()]]);
}
// Bestaand account op dit apparaat: voortgang samenvoegen, leagues opnieuw joinen, score van vandaag opnieuw insturen, tijdelijk gastaccount opruimen.
async function switchAccount(guestTok){
  try{
    const cloud=await rpc('yippo_load_progress');
    mergeProgress(cloud);
    if(cloud&&typeof cloud.name==='string'&&cloud.name)S.player.name=cloud.name.slice(0,20);   // de naam van het account wint
    const nm=(S.player&&S.player.name)||'';
    if(nm){
      for(const l of S.leagues.slice()){
        try{await rpc('yippo_join_league',{p_code:l.code,p_player_name:nm})}
        catch(e){if(e.message==='league_not_found')S.leagues=S.leagues.filter(x=>x.code!==l.code)}
      }
      const d=today();if(S.daily[d]!==undefined)S.pending={day:d,score:S.daily[d]};
    }
    save();booted=true;
    await submitPending();syncUp();
  }catch(e){}
  if(guestTok){try{await rpc('yippo_delete_account',{},guestTok)}catch(e){}}
}
async function logout(){
  try{await syncUp()}catch(e){}
  try{localStorage.removeItem('dm_save')}catch(e){}
  location.href=location.pathname;
}

function syncZooFromProgress(){   // wie al levels had gehaald, krijgt die dieren alsnog
  let ch=false;
  ZOO.forEach(a=>{if((S.stars[a.lvl]||0)>0&&!hasAnimal(a.id)){S.zoo.push(a.id);ch=true}});

function nextAnimal(){return ZOO.find(a=>!hasAnimal(a.id)&&a.lvl>=Math.min(S.unlocked,MAX_LEVEL))||ZOO.find(a=>!hasAnimal(a.id))||null}
function nextFriday(){
  const d=new Date();d.setHours(18,0,0,0);
  const add=(5-d.getDay()+7)%7;d.setDate(d.getDate()+add);
  if(d<=new Date())d.setDate(d.getDate()+7);
  return d;
}
function countdown(d){
  const ms=Math.max(0,d-new Date()),dd=Math.floor(ms/864e5),hh=Math.floor(ms%864e5/36e5),mm=Math.floor(ms%36e5/6e4);
  return dd>0?`nog ${dd}d ${hh}u`:`nog ${hh}u ${mm}m`;
}

}

/* --- wereldkaart met zebrapad --- */
const MAP_W=420,MAP_STEP=84,MAP_TOP=190,MAP_BOT=150;
const mapH=()=>MAP_TOP+(MAX_LEVEL-1)*MAP_STEP+MAP_BOT;
const mapX=L=>210+100*Math.sin((L-1)*.9+.25);
const mapY=L=>mapH()-MAP_BOT-(L-1)*MAP_STEP;
function smoothPath(pts){
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function renderMap(){
  const H=mapH(),cur=Math.min(S.unlocked,MAX_LEVEL),pts=[];
  for(let L=1;L<=MAX_LEVEL;L++)pts.push([mapX(L),mapY(L)]);
  const road=smoothPath(pts),svg=$('#mapSvg');
  svg.setAttribute('viewBox',`0 0 ${MAP_W} ${H}`);
  let h=`<defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe9ff"/><stop offset=".08" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#e4d36e"/><stop offset="1" stop-color="#8fc24a"/></linearGradient>
    <pattern id="cow" patternUnits="objectBoundingBox" width="1" height="1"><image href="icons/icon-192.png" width="58" height="58" preserveAspectRatio="xMidYMid slice"/></pattern></defs>
    <rect width="${MAP_W}" height="${H}" fill="url(#mg)"/><circle cx="350" cy="${H-120}" r="40" fill="#ffd23f" opacity=".9"/>`;
  // decor, vaste verdeling zodat het er altijd hetzelfde uitziet
  const dec=['🌳','🦒','🌾','🐘','🌳','🦁','🌿','🦓','🌳','🦛','🪨','🐆','🌴','🦏','🌾','🦍'];
  for(let L=1;L<=MAX_LEVEL;L+=1){
    const side=(L%2?1:-1),x=side>0?(L%4===1?34:388):(L%4===0?388:34),y=mapY(L)+((L*37)%50)-20;
    h+=`<text x="${x}" y="${y}" font-size="${L%3===0?46:38}" text-anchor="middle">${dec[(L*5)%dec.length]}</text>`;
  }
  h+=`<ellipse cx="60" cy="${H-60}" rx="120" ry="40" fill="#7cb342" opacity=".5"/>`;
  h+=`<path d="${road}" fill="none" stroke="#2d2d3a" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><path d="${road}" fill="none" stroke="#fff" stroke-width="40" stroke-dasharray="15 15" stroke-linejoin="round"/>`;
  // wereld 2 komt eraan
  const nf=nextFriday();
  h+=`<rect width="${MAP_W}" height="${MAP_TOP-30}" fill="#cfd8ea" opacity=".75"/><ellipse cx="80" cy="${MAP_TOP-30}" rx="130" ry="34" fill="#fff"/><ellipse cx="260" cy="${MAP_TOP-24}" rx="160" ry="36" fill="#fff"/><ellipse cx="400" cy="${MAP_TOP-34}" rx="90" ry="30" fill="#fff"/>
    <text x="210" y="70" font-size="34" text-anchor="middle">☁️🔒☁️</text><text x="210" y="102" font-size="16" font-weight="800" text-anchor="middle" fill="#5a189a">Wereld 2: De Lama's 🦙</text><text x="210" y="124" font-size="13" font-weight="700" text-anchor="middle" fill="#5a189a">opent vrijdag 18:00 · ${countdown(nf)}</text>`;
  for(let L=1;L<=MAX_LEVEL;L++){
    const x=pts[L-1][0],y=pts[L-1][1],done=(S.stars[L]||0)>0,locked=L>S.unlocked;
    const chest=L%5===0,animal=ZOO.find(a=>a.lvl===L);
    const fill=locked?'#6d6a8f':done?'#ffd23f':'#ff6b6b',txt=locked?'#ffffffb0':done?'#5b3a00':'#fff';
    h+=`<g data-l="${L}">`;
    if(L===S.unlocked&&!done)h+=`<circle class="cur" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${chest?38:40}" fill="#fff" opacity=".35"/>`;
    if(chest){
      const em=animal&&hasAnimal(animal.id)?animal.e:'🎁';
      h+=`<rect x="${(x-27).toFixed(1)}" y="${(y-27).toFixed(1)}" width="54" height="54" rx="15" fill="${fill}" stroke="#fff" stroke-width="4" stroke-opacity="${locked?.5:1}"/><text x="${x.toFixed(1)}" y="${(y+10).toFixed(1)}" font-size="${L===40?30:28}" text-anchor="middle" ${locked?'opacity=".75"':''}>${em}</text><text x="${x.toFixed(1)}" y="${(y+44).toFixed(1)}" font-size="12" font-weight="900" text-anchor="middle" fill="${locked?'#4a2b6e':'#5b3a00'}">${L}</text>`;
    }else{
      const r=(L===S.unlocked&&!done)?30:24;
      h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" stroke="#fff" stroke-width="4" stroke-opacity="${locked?.5:1}"/><text x="${x.toFixed(1)}" y="${(y+7).toFixed(1)}" font-size="19" font-weight="900" text-anchor="middle" fill="${txt}">${L}</text>`;
      if(done)h+=`<text x="${x.toFixed(1)}" y="${(y+40).toFixed(1)}" font-size="10" text-anchor="middle">${'⭐'.repeat(S.stars[L]||1)}</text>`;
    }
    h+='</g>';
  }
  // jij bent hier
  const cx=pts[cur-1][0],cy=pts[cur-1][1],left=cx>150;
  const ax=left?cx-112:cx+54,ay=cy-30;
  h+=`<rect x="${ax}" y="${ay}" width="58" height="58" rx="14" fill="url(#cow)" stroke="#fff" stroke-width="3.5"/><g><rect x="${left?ax-6:ax-4}" y="${ay+62}" width="76" height="18" rx="9" fill="#ffd23f"/><text x="${(left?ax-6:ax-4)+38}" y="${ay+75}" font-size="10" font-weight="900" text-anchor="middle" fill="#5b3a00">Jij bent hier!</text></g>`;
  svg.innerHTML=h;
  const wrap=$('#mapScroll');
  $('#mapPill').textContent=`${WORLD1.emoji} Wereld ${WORLD1.id} · ${WORLD1.name} · ${Math.min(S.unlocked,MAX_LEVEL)}/${MAX_LEVEL}`;
  const na=nextAnimal();
  $('#mapHint').textContent=na?`Volgend dier bij level ${na.lvl}: ${na.e}`:'Alle dieren van deze wereld verzameld! 🎉';
  $('#mapPlay').textContent=`▶ Speel level ${cur}`;
  const scale=wrap.clientWidth/MAP_W;
  wrap.scrollTop=Math.max(0,cy*scale-wrap.clientHeight*.55);
}

    return `<button class="an${g?'':' locked'}" data-a="${a.id}"><div class="e">${a.e}</div><span class="l">${g?esc(a.n):'🔒 '+extra}</span>${g&&newIds.includes(a.id)?'<span class="nb" style="right:2px;top:0">NIEUW!</span>':''}</button>`;
  };
  const have1=ZOO.filter(a=>hasAnimal(a.id)).length;
  $('#zooPens').innerHTML=
    `<div class="pen" style="background:#a8d86b"><h3>🦓 De Zebra-weide · ${have1}/${ZOO.length}</h3><div class="grid">${ZOO.map(a=>cell(a,'level '+a.lvl)).join('')}</div></div>`+
    `<div class="pen" style="background:#d9b8f2;border-color:#8a5fb8"><h3>✨ Fantasiedieren · ${FANTASY.filter(a=>hasAnimal(a.id)).length}/${FANTASY.length}</h3><div class="grid">${FANTASY.map(a=>cell(a,a.how)).join('')}</div></div>`+
    `<div class="pen" style="background:#ffffff1a;border-color:#ffffff55;color:#fff;text-align:center;font-weight:800;padding:18px 10px 14px"><div style="margin:0">🦙 De Lama-bergen<br><small>🔒 opent vrijdag 18:00 · ${countdown(nextFriday())}</small></div></div>`;
  $('#zooPens').querySelectorAll('.an').forEach(b=>b.onclick=()=>{
    const a=ALL_ANIMALS.find(x=>x.id===b.dataset.a);sfx.ui();
    if(hasAnimal(a.id))modal(`<div class="rew"><div class="big">${a.e}</div><b>${esc(a.n)}</b><br><small>${esc(a.fact)}</small><br><small>${a.lvl?'Verzameld bij level '+a.lvl:'Fantasiedier ✨'}</small></div>`,[['Mooi!','',()=>{}]]);
    else modal(`<div class="rew"><div class="big sil">${a.e}</div><b>Nog niet verzameld</b><br><small>${a.lvl?`Speel level ${a.lvl} om de ${esc(a.n.toLowerCase())} te verzamelen.`:`Speel de dagelijkse puzzel ${a.how} om de ${esc(a.n.toLowerCase())} te krijgen.`}</small></div>`,[['Oké','',()=>{}]]);
  });
  if(newIds.length){S.zooSeen=S.zoo.slice();save()}
}
$('#zooBack').onclick=toMenu;
$('#zooMap').onclick=()=>{sfx.ui();openMap()};

/* --- nieuw beginscherm --- */
function renderMenu2(){
  const cur=Math.min(S.unlocked,MAX_LEVEL);
  $('#m2PlaySub').textContent=`Level ${cur} · ${WORLD1.emoji} ${WORLD1.name}`;
  const best=S.daily[today()];
  $('#m2DailySub').textContent=(best!==undefined?`Beste: ${fmt(best)}`:'Nieuwe puzzel vandaag')+((S.streak.last===today()||S.streak.last===yesterday())&&S.streak.count?` · 🔥 ${S.streak.count} ${S.streak.count===1?'dag':'dagen'}`:'');
  const earned=ZOO.filter(a=>hasAnimal(a.id)),next=nextAnimal();
  $('#m2Scene').innerHTML=earned.slice(-5).map(a=>`<span>${a.e}</span>`).join('')+(next?`<span class="sil">${next.e}</span>`:'')+(earned.length?'':'<span style="font-size:15px;font-weight:800;color:#fff">Verzamel je eerste dier bij level 5!</span>');
  const tot=ALL_ANIMALS.length;
  $('#m2ZooBar').style.width=Math.round(S.zoo.length/tot*100)+'%';$('#m2ZooTxt').textContent=`${S.zoo.length} / ${tot}`;
  const old=$('#m2Zoo .nb');if(old)old.remove();
  if(zooNew()){const b=document.createElement('span');b.className='nb';b.style.cssText='right:10px;top:10px;font-size:12px';b.textContent='NIEUW DIER!';$('#m2Zoo').appendChild(b)}
  $('#m2Sound').textContent=S.sound?'🔊 Geluid':'🔇 Geluid uit';
  const on=online();
  $('#m2Board').style.display=on?'':'none';$('#m2League').style.display=on?'':'none';$('#m2Account').style.display=on?'':'none';
  $('#m2Login').style.display=isGuest()?'':'none';
}
$('#m2Play').onclick=e=>{sfx.ui();if(e.target.id==='m2Map')openMap();else startLevel(Math.min(S.unlocked,MAX_LEVEL))};
$('#m2Daily').onclick=()=>{sfx.ui();startGame(dailyDef(),'daily')};
$('#m2Zoo').onclick=()=>{sfx.ui();openZoo()};
$('#m2Board').onclick=()=>{sfx.ui();openLB('world')};
$('#m2League').onclick=()=>{sfx.ui();openLB('leagues')};
$('#m2Account').onclick=()=>{sfx.ui();accountDialog()};
$('#m2Help').onclick=()=>{sfx.ui();showHelp()};
$('#m2Sound').onclick=()=>{S.sound=!S.sound;save();renderMenu2();sfx.ui()};
$('#m2Login').onclick=()=>{sfx.ui();emailDialog(true)};

/* ============ menus ============ */
function showHelp(){
  modal(`<h2>Zo speel je</h2>
  <p>Sleep een dier naar een buur (of tik er twee aan). Maak <b>3 of meer gelijke</b> dieren op een rij, dan verdwijnen ze!</p>
  <table class="help">
  <tr><td>4 op een rij</td><td>🦁 <b>Leeuw</b>: wist een hele rij of kolom (pijltje!)</td></tr>
  <tr><td>2×2 vierkantje</td><td>🐘 <b>Olifant</b>: wist een gebied van 3×3</td></tr>
  <tr><td>L- of T-vorm</td><td>🐉 <b>Draak</b>: wist een rij én kolom</td></tr>
  <tr><td>5 op een rij</td><td>🦄 <b>Eenhoorn</b>: wissel hem met een dier en alle dieren van die soort verdwijnen</td></tr>
  </table>
  <p><small>Wissel een speciaal dier met een buur, of tik hem twee keer, om hem te activeren. Twee speciale dieren naast elkaar wisselen geeft een mega-effect!<br>🔨 haalt één dier weg, 🔀 schudt het bord. 🧊 ijs verdwijnt als je er een setje op maakt.</small></p>`,
  [['Begrepen!','',()=>{}]]);
}
function toMenu(){
  closeModal();
  if(BETA){syncZooFromProgress();show('menu2');renderMenu2();submitPending();return}
  show('menu');
  $('#streakTxt').textContent=(S.streak.last===today()||S.streak.last===yesterday())&&S.streak.count?`🔥 ${S.streak.count} ${S.streak.count===1?'dag':'dagen'} op rij`:'';
  $('#mDaily').textContent=S.daily[today()]!==undefined?`📅 Dagelijks (beste: ${fmt(S.daily[today()])})`:'📅 Dagelijkse puzzel';
  $('#mSound').textContent=S.sound?'🔊 Geluid aan':'🔇 Geluid uit';
  $('#mBoard').style.display=online()?'':'none';
  $('#mAccount').style.display=online()?'':'none';
  $('#mLogin').style.display=isGuest()?'':'none';
  submitPending();
}
function toLevels(){
  closeModal();
  if(BETA){openMap();return}
  show('levels');
  const g=$('#lvgrid');g.innerHTML='';
  for(let L=1;L<=MAX_LEVEL;L++){
    const b=document.createElement('button');
    const st=S.stars[L]||0;
    b.className='lv'+(L>S.unlocked?' locked':'')+(L===S.unlocked?' next':'');
    b.innerHTML=`${L}<small>${L>S.unlocked?'🔒':st?'⭐'.repeat(st):''}</small>`;
    b.onclick=()=>{sfx.ui();startLevel(L)};g.appendChild(b);
  }
}

$('#mPlay').onclick=()=>{sfx.ui();startLevel(Math.min(S.unlocked,MAX_LEVEL))};
$('#mDaily').onclick=()=>{sfx.ui();startGame(dailyDef(),'daily')};
$('#mLevels').onclick=()=>{sfx.ui();toLevels()};
$('#mBoard').onclick=()=>{sfx.ui();openLB('world')};
$('#mAccount').onclick=()=>{sfx.ui();accountDialog()};
$('#mLogin').onclick=()=>{sfx.ui();emailDialog(true)};
$('#tabWorld').onclick=()=>{sfx.ui();lbTab='world';renderLB()};
$('#tabLeagues').onclick=()=>{sfx.ui();lbTab='leagues';renderLB()};
$('#lbBack').onclick=toMenu;
$('#lbName').onclick=()=>{sfx.ui();ensurePlayer();askName(()=>{})};
$('#mHelp').onclick=()=>{sfx.ui();showHelp()};
$('#mSound').onclick=()=>{S.sound=!S.sound;save();toMenu();sfx.ui()};
$('#lvBack').onclick=toMenu;
$('#tHelp').onclick=()=>{if(G&&!G.busy)showHelp()};
$('#tHammer').onclick=()=>{if(!G||G.busy||G.over||G.hammers<=0)return;sfx.ui();G.hammerOn=!G.hammerOn;if(G.hammerOn){setSel(null);toast('Tik op een dier om het weg te halen')}hud()};
$('#tShuffle').onclick=async()=>{
  if(!G||G.busy||G.over||G.shuffles<=0)return;
  G.busy=true;G.shuffles--;hud();clearHint();setSel(null);
  await doShuffle(false);
  const groups=findGroups();if(groups.length)await resolve(null,[]);
  await endCheck();if(!G.over){G.busy=false;scheduleHint()}
};
$('#gMenu').onclick=()=>{
  if(!G)return;
  if(G.over){sfx.ui();toMenu();return}
  if(G.busy){toast('Even wachten…');return}
  sfx.ui();
  modal('<h2>Pauze</h2>',[
    ['Verder spelen','',()=>{}],
    ['↻ Opnieuw','dim',()=>G.mode==='daily'?startGame(dailyDef(),'daily'):startLevel(G.def.L)],
    [S.sound?'🔊 Geluid uit':'🔇 Geluid aan','dim',()=>{S.sound=!S.sound;save()}],
    ['Naar menu','dim',toMenu]]);
};

toMenu();
bootOnline().then(handleInvite);
</script>
</body>
</html>
