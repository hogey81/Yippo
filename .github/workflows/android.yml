# Bouwt de Android-testapp (app/) en zet hem op de release "android-test",
# zodat je hem direct vanaf GitHub op je telefoon kunt downloaden en installeren.
name: Android testapp

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installeren en synchroniseren
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Bouwen
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Bestand een naam geven
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Yippo-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android testapp
          prerelease: true
          overwrite_files: true
          body: |
            Testversie van de Yippo-app voor Android, gebouwd van ${{ github.sha }}.
            Download Yippo-test.apk op je telefoon en open het bestand om te installeren.
          files: Yippo-test.apk
